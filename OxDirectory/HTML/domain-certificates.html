<div class="domain-result-view" data-domain-kind="certificates">
    <div class="page-header">
        <div><div class="section-title">Certificates</div><div class="section-sub">Certificate authority and template records</div></div>
        <div class="domain-count"></div>
    </div>
    <div class="cert-summary" id="cert-summary"></div>
    <div class="domain-toolbar">
        <input class="domain-search" type="search" placeholder="Search certificates">
    </div>
    <div class="domain-table-wrap">
        <table class="domain-table">
            <thead><tr class="domain-table-head"></tr></thead>
            <tbody class="domain-table-body"></tbody>
        </table>
    </div>
    <div class="domain-pagination">
        <button class="domain-prev">Previous</button>
        <span class="domain-page">-</span>
        <button class="domain-next">Next</button>
    </div>
</div>
