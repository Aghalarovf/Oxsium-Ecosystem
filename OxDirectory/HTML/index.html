<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OxDirectory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/topbar.css">
<link rel="stylesheet" href="/css/panels.css">
<link rel="stylesheet" href="/css/upload.css?v=20261112-1701">
<link rel="stylesheet" href="/css/domain-results.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/auth.css?v=20261108-1634">
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">
        <div class="logo-icon">OD</div>
        <div class="logo-name">Ox<span class="logo-sub">Directory</span></div>
    </div>
    <div class="conn-badge">
        <div class="conn-dot" id="conn-dot"></div>
        <div class="conn-label" id="conn-label">Connecting</div>
    </div>
</div>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-section sidebar-upload">
            <div class="sidebar-section-title sidebar-category-title">Upload</div>
            <div class="nav-item" id="nav-upload" data-view="upload">Upload Results</div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Navigation</div>
            <div class="nav-item active" data-view="dashboard">Dashboard</div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Administration</div>
            <a class="nav-item" id="nav-admin-panel" href="/admincpanel" hidden>Admin Panel</a>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Domain Results</div>
            <div class="nav-item" data-view="domain">Domain</div>
            <div class="nav-item" data-view="domain-users">Users</div>
            <div class="nav-item" data-view="domain-groups">Groups</div>
            <div class="nav-item" data-view="domain-computers">Computers</div>
            <div class="nav-item" data-view="domain-ous">OUs</div>
            <div class="nav-item" data-view="domain-gpos">GPOs</div>
            <div class="nav-item" data-view="domain-trusts">Trusts</div>
            <div class="nav-item" data-view="domain-aces">ACEs</div>
            <div class="nav-item" data-view="domain-certificates">Certificates</div>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-version">v0.1.0</div>
        </div>
    </div>

    <div class="main">
        <div id="view-root"></div>
    </div>

    <div class="right-panel">
        <div class="panel-header">Session</div>
        <div class="stat-block">
            <div class="stat-label">Status</div>
            <div class="stat-value" id="panel-status">-</div>
        </div>
    </div>
</div>

<div class="statusbar">
    <div class="statusbar-item"><span class="s-label">STATUS:</span><span class="s-val" id="status-text">idle</span></div>
    <div class="statusbar-item statusbar-right"><span class="s-label">VIEW:</span><span class="s-val" id="status-view">dashboard</span></div>
</div>

<script src="/js/state.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js?v=20261109-1715"></script>
<script src="/js/api.js"></script>
<script src="/js/upload.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/domain-results.js"></script>
<script src="/js/nav.js?v=20261109-1717"></script>
</body>
</html>
