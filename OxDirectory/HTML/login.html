<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - OxDirectory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-grid"></div>
    <div class="auth-orb auth-orb-a"></div>
    <div class="auth-orb auth-orb-b"></div>
    <div class="auth-scanline"></div>

    <div class="auth-card">
        <div class="auth-card-glow"></div>

        <div class="auth-logo">
            <div class="logo-icon">
                <span>OD</span>
            </div>
            <div class="auth-logo-text">
                <div class="logo-name">Ox<span class="logo-sub">Directory</span></div>
                <div class="auth-logo-tag">Directory Intelligence Console</div>
            </div>
        </div>

        <div class="auth-divider"></div>

        <div class="auth-title">
            <span class="auth-title-dot"></span>
            Secure Sign In
        </div>

        <form id="login-form" autocomplete="off" novalidate>
            <div class="auth-field">
                <label for="login-username">Username</label>
                <div class="auth-input-wrap">
                    <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12Zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9Z" fill="currentColor"/>
                    </svg>
                    <input id="login-username" name="username" type="text" autocomplete="username" placeholder="Enter your username" required>
                </div>
            </div>
            <div class="auth-field">
                <label for="login-password">Password</label>
                <div class="auth-input-wrap">
                    <svg class="auth-input-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 10V7a5 5 0 0 0-10 0v3a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2ZM9 7a3 3 0 0 1 6 0v3H9V7Z" fill="currentColor"/>
                    </svg>
                    <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                    <button type="button" class="auth-toggle-visibility" id="toggle-password" tabindex="-1" aria-label="Toggle password visibility">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5c-5.5 0-9.3 4.1-10.5 7 1.2 2.9 5 7 10.5 7s9.3-4.1 10.5-7C21.3 9.1 17.5 5 12 5Zm0 11.7A4.7 4.7 0 1 1 12 7.3a4.7 4.7 0 0 1 0 9.4Z" fill="currentColor"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-submit" id="login-submit">
                <span class="auth-submit-label">Sign In</span>
                <span class="auth-submit-spinner"></span>
            </button>

            <div class="auth-error" id="login-error">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2 1 21h22L12 2Zm1 15h-2v2h2v-2Zm0-7h-2v5h2v-5Z" fill="currentColor"/>
                </svg>
                <span id="login-error-text"></span>
            </div>
        </form>

        <div class="auth-footnote">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2 3 6v6c0 5.2 3.8 9.9 9 11 5.2-1.1 9-5.8 9-11V6l-9-4Z" stroke="currentColor" stroke-width="1.4"/>
            </svg>
            Access is restricted to authorized accounts only
        </div>
    </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
