<div class="section-toolbar">
    <div class="section-toolbar-title dash-title">Dashboard</div>
    <div class="dashboard-actions" hidden>
        <span class="dashboard-actions-label">Dataset actions</span>
        <button id="dashboard-reset" class="btn-danger" type="button">Reset data</button>
    </div>
</div>
<div class="section-sub" id="dashboard-sub">Overview of the loaded port-scan dataset</div>
<div class="dashboard-scope">
    <label for="dashboard-group-filter">Show results for</label>
    <select id="dashboard-group-filter">
        <option value="">All subnets</option>
    </select>
</div>
<div class="dash-filter-note" id="dash-filter-note" hidden></div>
<div class="kpi-grid" id="dashboard-stats"></div>
<div class="dash-grid" id="dash-grid" hidden>
    <div class="dash-card" style="--i:0">
        <div class="card-title">OS Distribution</div>
        <div class="chart-box" id="chart-os"></div>
    </div>
    <div class="dash-card" style="--i:1">
        <div class="card-title">Host Roles</div>
        <div class="chart-box" id="chart-roles"></div>
    </div>
    <div class="dash-card dash-wide" style="--i:2">
        <div class="card-title">Top Open Ports <span class="card-hint">all ports &middot; scroll for rarer &middot; click to filter</span></div>
        <div class="chart-box" id="chart-ports"></div>
    </div>
    <div class="dash-card" style="--i:3">
        <div class="card-title">Open Ports per Host</div>
        <div class="chart-box" id="chart-hist"></div>
    </div>
    <div class="dash-card" style="--i:4">
        <div class="card-title">Attention Services <span class="card-hint">click to filter &middot; arrow lists hosts</span></div>
        <div class="chart-box" id="chart-risk"></div>
    </div>
    <div class="dash-card" style="--i:5">
        <div class="card-title">Most Exposed Hosts</div>
        <div class="chart-box" id="chart-exposed"></div>
    </div>
    <div class="dash-card" style="--i:6">
        <div class="card-title">Hosts per Subnet</div>
        <div class="chart-box" id="chart-subnets"></div>
    </div>
</div>
<div class="chart-tip" id="chart-tip" hidden></div>
