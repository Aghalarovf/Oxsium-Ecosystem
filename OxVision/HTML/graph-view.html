<div class="section-toolbar">
    <div>
        <div class="section-toolbar-title graph-title">Network Graph</div>
        <div class="graph-subtitle">Live topology of discovered hosts and their connections</div>
    </div>
    <div class="graph-live-indicator"><span></span> LIVE TOPOLOGY</div>
</div>
<div class="graph-metrics" aria-label="Graph summary">
    <div class="graph-metric" style="--metric-color: var(--accent)">
        <span class="graph-metric-label">Nodes</span>
        <strong id="graph-stat-nodes">-</strong>
        <span class="graph-metric-hint">discovered hosts</span>
    </div>
    <div class="graph-metric" style="--metric-color: var(--blue)">
        <span class="graph-metric-label">Connections</span>
        <strong id="graph-stat-edges">-</strong>
        <span class="graph-metric-hint">scanner links</span>
    </div>
    <div class="graph-metric" style="--metric-color: var(--green)">
        <span class="graph-metric-label">Open ports</span>
        <strong id="graph-stat-ports">-</strong>
        <span class="graph-metric-hint">across all hosts</span>
    </div>
    <div class="graph-metric" style="--metric-color: var(--amber)">
        <span class="graph-metric-label">Interaction</span>
        <strong>ZOOM</strong>
        <span class="graph-metric-hint">drag nodes to explore</span>
    </div>
</div>
<div class="graph-stage">
    <div class="graph-stage-header">
        <span><i></i> Topology map</span>
        <span class="graph-stage-hint">Scroll to zoom &middot; drag to reposition</span>
    </div>
    <div id="graph-container"></div>
</div>
<div class="graph-legend-wrap">
    <div class="graph-legend-title">Node classification</div>
    <div class="graph-legend" id="graph-legend"></div>
</div>
<div id="graph-details" class="graph-details"></div>
<section id="graph-note-panel" class="graph-note-panel" hidden aria-labelledby="graph-note-title">
    <div class="graph-note-panel-header">
        <div id="graph-note-title" class="graph-note-panel-title">Add Note</div>
        <button id="graph-note-close" class="graph-note-close" type="button" aria-label="Close Add Note panel">&times;</button>
    </div>
    <div class="graph-note-host">
        <span class="graph-note-label">Host</span>
        <span id="graph-note-host"></span>
    </div>
    <label class="graph-note-label" for="graph-note-input">Note</label>
    <textarea id="graph-note-input" rows="4" placeholder="Enter a note for this host"></textarea>
    <div class="graph-note-actions">
        <button id="graph-note-cancel" class="btn-secondary" type="button">Cancel</button>
        <button id="graph-note-save" class="btn-primary" type="button">Save Note</button>
    </div>
</section>
