<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OxVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/topbar.css">
<link rel="stylesheet" href="/css/buttons.css">
<link rel="stylesheet" href="/css/panels.css">
<link rel="stylesheet" href="/css/graph.css">
<link rel="stylesheet" href="/css/modals.css">
<link rel="stylesheet" href="/css/filters.css">
<link rel="stylesheet" href="/css/roles.css">
<link rel="stylesheet" href="/css/dashboard.css">
<link rel="stylesheet" href="/css/vulnerabilities.css">
<link rel="stylesheet" href="/css/all-vulnerabilities.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="topbar">
    <div class="topbar-logo">
        <div class="logo-icon">OV</div>
        <div class="logo-name">Ox<span class="logo-sub">Vision</span></div>
    </div>
    <div class="conn-badge">
        <div class="conn-dot" id="conn-dot"></div>
        <div class="conn-label" id="conn-label">Connecting</div>
    </div>
</div>

<div class="layout">
    <div class="sidebar">
        <div class="sidebar-section sidebar-upload">
            <div class="sidebar-section-title sidebar-category-title">Upload</div>
            <div class="nav-item" id="nav-upload" data-view="upload">Upload Results</div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Navigation</div>
            <div class="nav-item" id="nav-subnets" data-view="subnets">Subnets</div>
            <div class="nav-item" data-view="dashboard">Dashboard</div>
            <div class="nav-item" data-view="graph-view">Network Graph</div>
            <div class="nav-item" data-view="hosts-table">Hosts</div>
            <div class="nav-item" data-view="all-vulnerabilities">Vulnerabilities</div>
        </div>
        <div class="sidebar-section">
            <div class="sidebar-section-title">Administration</div>
            <a class="nav-item" id="nav-admin-panel" href="/admincpanel" hidden>Admin Panel</a>
        </div>
        <div class="sidebar-section sidebar-filter collapsed" id="sf-panel">
            <div class="sidebar-section-title sf-section-heading">Sort &amp; Filters</div>
            <div class="nav-item sf-toggle" id="sf-toggle" role="button" tabindex="0" aria-expanded="false">
                <span>Filters</span>
                <span class="sf-badge" id="sf-badge" hidden>0</span>
                <span class="sf-caret">&#9662;</span>
            </div>
            <div class="sf-body">
                <div class="sf-field">
                    <label for="sf-q">Search</label>
                    <input id="sf-q" class="sf-input" type="search" placeholder="IP, service, role, note..." autocomplete="off">
                </div>
                <div class="sf-field">
                    <label>Operating System</label>
                    <div class="sf-chips" id="sf-os"></div>
                </div>
                <div class="sf-field">
                    <label>Roles</label>
                    <div class="sf-chips" id="sf-roles"></div>
                </div>
                <div class="sf-field">
                    <label for="sf-port">Port(s)</label>
                    <input id="sf-port" class="sf-input" placeholder="22, 445, 8000-8100, 53/udp" autocomplete="off">
                </div>
                <div class="sf-field">
                    <label for="sf-service">Service</label>
                    <input id="sf-service" class="sf-input" list="sf-services" placeholder="http, smb, ssh..." autocomplete="off">
                    <datalist id="sf-services"></datalist>
                </div>
                <div class="sf-field">
                    <label for="sf-min">Min. open ports</label>
                    <input id="sf-min" class="sf-input" type="number" min="0" placeholder="0">
                </div>
                <div class="sf-field">
                    <label for="sf-sort">Sort by</label>
                    <div class="sf-row">
                        <select id="sf-sort" class="sf-input">
                            <option value="">Default order</option>
                            <option value="ip">IP address</option>
                            <option value="os">Operating system</option>
                            <option value="ports">Open port count</option>
                            <option value="roles">Role count</option>
                        </select>
                        <button type="button" id="sf-dir" class="sf-dir" disabled>ASC</button>
                    </div>
                </div>
                <button type="button" id="sf-reset" class="btn-secondary sf-reset" disabled>Reset filters</button>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="sidebar-version">v1.1.0</div>
        </div>
    </div>

    <div class="main">
        <div id="view-root"></div>
    </div>

    <div class="right-panel">
        <div class="panel-header">Session</div>
        <div class="stat-block">
            <div class="stat-label">Hosts</div>
            <div class="stat-value" id="panel-hosts">-</div>
        </div>
        <div class="stat-block">
            <div class="stat-label">Open Ports</div>
            <div class="stat-value" id="panel-ports">-</div>
        </div>
        <div class="stat-block">
            <div class="stat-label">Mode</div>
            <div class="stat-value" id="panel-mode">-</div>
        </div>
        <div class="panel-header panel-header-subnets">
            <span>Subnets</span>
            <select id="subnet-sort" class="subnet-sort" aria-label="Sort subnets">
                <option value="default">Default order</option>
                <option value="hosts">Hosts: high to low</option>
                <option value="name-asc">Name: low to high</option>
                <option value="name-desc">Name: high to low</option>
            </select>
        </div>
        <div id="subnet-note" class="panel-note" hidden></div>
        <div id="subnet-selectbar" class="subnet-selectbar" hidden>
            <span id="subnet-select-count">0 selected</span>
            <button type="button" id="subnet-select-delete" class="danger">Delete</button>
            <button type="button" id="subnet-select-done">Done</button>
        </div>
        <div id="panel-subnets" class="panel-subnets">
            <div class="panel-empty">No subnets</div>
        </div>
    </div>
</div>

<div class="statusbar">
    <div class="statusbar-item"><span class="s-label">STATUS:</span><span class="s-val" id="status-text">idle</span></div>
    <div class="statusbar-item statusbar-right"><span class="s-label">VIEW:</span><span class="s-val" id="status-view">dashboard</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="/js/state.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/api.js"></script>
<script src="/js/filters.js"></script>
<script src="/js/roles.js"></script>
<script src="/js/all-vulnerabilities.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/dashboard.js"></script>
<script src="/js/upload.js"></script>
<script src="/js/cvss.js"></script>
<script src="/js/vulnerabilities.js"></script>
<script src="/js/graph.js"></script>
<script src="/js/hosts-table.js"></script>
<script src="/js/subnets.js"></script>
</body>
</html>
