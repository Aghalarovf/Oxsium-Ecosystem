<div class="page-hero">
    <div>
        <div class="section-title page-title">Subnets</div>
        <div class="section-sub">Network ranges discovered across all saved scan results</div>
    </div>
    <div class="page-status"><span></span> NETWORK INVENTORY</div>
</div>
<div class="page-summary">
    <div class="summary-card" style="--summary-color: var(--blue)">
        <span>Tracked ranges</span>
        <strong id="subnets-count">0</strong>
        <small>available subnets</small>
    </div>
    <div class="summary-card" style="--summary-color: var(--accent)">
        <span>Selection</span>
        <strong id="subnets-selection">ALL</strong>
        <small>click a range to filter</small>
    </div>
</div>
<div class="subnet-groups-toolbar">
    <label for="subnet-group-filter">Group</label>
    <select id="subnet-group-filter">
        <option value="">All groups</option>
    </select>
    <input id="subnet-group-name" type="text" maxlength="40" placeholder="New group name">
    <button type="button" class="btn-secondary" id="subnet-group-create">Create group</button>
</div>
<div class="data-table-wrap inventory-card">
    <div class="data-table-head">
        <div class="data-col flex1">Subnet</div>
        <div class="data-col subnet-group-col">Group</div>
    </div>
    <div class="data-table-body" id="subnets-table-body"></div>
</div>
