scan:
  profile: quick
  modules: all
  exclude_modules: []
  module_workers: 2
  passive_only: false

network:
  timeout: 15
  retries: 1
  proxy: null
  user_agent: "oxwebx/1.0 (+security-recon)"
  user_agents: []
  headers: {}
  verify_tls: false
  max_body_bytes: 1048576
  rate_limit:
    delay: 0.0
    jitter: 0.0

dns:
  nameservers: [1.1.1.1, 8.8.8.8, 9.9.9.9]
  port: 53
  timeout: 5
  lifetime: 10
  use_tcp: false

output:
  directory: results
  formats: [console, json]
  color: true

logging:
  level: info
  progress_events: false

extensions:
  enabled: []

modules:
  whois_dns:
    checks:
      - records
      - whois
      - email_security
      - reverse_dns
      - ip_intel
      - cdn
      - zone_transfer
      - dnssec
      - ttl_anomaly
      - dangling
      - blacklist
      - historical
      - cross_search
    threads: 6
    records:
      categories: [core, security, service]
      extra_types: []
      threads: 8
      discover_services: true
      legacy_probe: true
      wildcard_probes: 3
      ns_probe: true
      ns_probe_limit: 8
      cname_chain_warn: 3
      record_count_warn: 30
    email_security:
      dkim_probe: true
      dkim_threads: 10
      mta_sts_fetch: true
    whois:
      server: null
      use_rdap: true
      use_port43: true
      expiry_warning_days: 30
      long_registration_years: 5
      new_domain_days: 30
    reverse_dns:
      max_ips: 8
      max_names: 8
    ip_intel:
      max_ips: 6
      providers: [ip-api, ipwho, rdap]
    cdn:
      http_probe: true
    zone_transfer:
      timeout: 10
      lifetime: 30
      try_ixfr: true
      any_query: true
      max_records: 5000
    dnssec:
      nsec_walk: true
      nsec_walk_limit: 50
      validate_signatures: true
    ttl_anomaly:
      probes: 5
      probe_delay: 2.0
      low_ttl: 300
      very_low_ttl: 60
      ns_low_ttl: 3600
      mx_low_ttl: 600
      ip_warn: 4
      ip_crit: 8
    dangling:
      extra_labels: true
      http_fetch: true
      wildcard_probes: 3
      check_ns_root: true
      check_mx: true
      check_srv: true
      check_expired_targets: true
      max_hosts: 60
    blacklist:
      timeout: 15
      workers: 20
      max_ips: 8
      nameservers: []
    historical:
      rdap_events: true
      wayback: true
      recent_days: 90
      archive_gap_days: 730
      whoisfreaks_api_key: null
    cross_search:
      sources: [hackertarget, ripestat]
      max_ns: 3
      max_ips: 2
      max_related: 200
      shared_hosting_threshold: 10
